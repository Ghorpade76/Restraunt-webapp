<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 1040px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 clamp(1.5rem, 2vw, 2.25rem);
            background: transparent;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, #5B67D6 0%, #7B68B8 100%);
            color: white;
            padding: 48px 24px;
            margin-bottom: 48px;
            box-shadow: 0 8px 32px rgba(91, 103, 214, 0.18);
            backdrop-filter: blur(2px);
            border-radius: 0 0 32px 32px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            line-height: 1.1;
            transition: font-size 0.2s;
        }
        h1:hover {
            color: #ffd700;
            transform: scale(1.07);
            text-shadow: 0 4px 24px rgba(91, 103, 214, 0.18);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s, text-shadow 0.2s;
        }

        header p {
            font-size: clamp(1rem, 2vw, 1.35rem);
            opacity: 0.95;
            font-weight: 400;
            margin-bottom: 8px;
            line-height: 1.3;
            transition: font-size 0.2s;
        }
        header p:hover {
            color: #e0e7ff;
            letter-spacing: 0.04em;
            transition: color 0.2s, letter-spacing 0.2s;
        }

        .search-box {
            background: white;
            padding: 8px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            max-width: 680px;
            margin: 0 auto 48px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
            border: 1px solid #e5e7eb;
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            padding: 14px 20px;
                    /* Desktop enhancements */
                    @media (min-width: 1024px) {
                        .container {
                            padding: 0 3rem;
                        }
                        .restaurants-grid {
                            grid-template-columns: repeat(3, 1fr);
                        }
                        .restaurant-card {
                            min-height: 480px;
                        }
                        .modal-content {
                            max-width: 900px;
                        }
                        .menu-section {
                            padding: 48px;
                        }
                    }
                    /* Small devices */
                    @media (max-width: 480px) {
                        header {
                            padding: 18px 8px;
                        }
                        h1 {
                            font-size: 1.25rem;
                        }
                        .search-box input {
                            font-size: 0.9rem;
                            padding: 10px 12px;
                        }
                        .restaurant-card {
                            min-height: 320px;
                        }
                        .modal-content {
                            margin: 2px;
                            padding: 2px;
                        }
                        .menu-section {
                            padding: 12px 4px;
                        }
                    }
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #1f2937;
        }

        .search-box input::placeholder {
            color: #9ca3af;
        }

        .search-box button {
            background: linear-gradient(135deg, #5B67D6 0%, #7B68B8 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .search-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(91, 103, 214, 0.3);
        }

        .search-box button:focus {
            outline: 2px solid #5B67D6;
            outline-offset: 2px;
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: clamp(1.5rem, 2vw, 2rem);
            margin-bottom: 48px;
        }

        .restaurant-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }

        .restaurant-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(31, 41, 55, 0.18);
            border-color: #d1d5db;
        }

        .restaurant-image {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background: #f3f4f6;
        }

        .restaurant-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .restaurant-card:hover .restaurant-image img {
            transform: scale(1.08);
        }

        .restaurant-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            padding: 24px 20px 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .restaurant-card:hover .restaurant-overlay {
            opacity: 1;
        }

        .restaurant-name-overlay {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .restaurant-info {
            padding: 24px;
        }

        .restaurant-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1f2937;
            letter-spacing: -0.01em;
        }

        .restaurant-cuisine {
            color: #5B67D6;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .restaurant-location {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restaurant-description {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 860px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #5B67D6 0%, #7B68B8 100%);
            color: white;
            padding: 40px;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .modal-restaurant-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .modal-cuisine {
            opacity: 0.95;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-section {
            padding: 40px;
        }

        .menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 28px;
            color: #1f2937;
            letter-spacing: -0.01em;
        }

        .menu-item {
            padding: 24px 0;
            border-bottom: 1px solid #e5e7eb;
            transition: all 0.2s ease;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f9fafb;
            padding-left: 16px;
            padding-right: 16px;
            margin-left: -16px;
            margin-right: -16px;
            border-radius: 12px;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            gap: 16px;
        }

        .menu-item-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.4;
        }

        .menu-item-price {
            color: #5B67D6;
            font-weight: 700;
            font-size: 1.15rem;
            white-space: nowrap;
        }

        .menu-item-description {
            color: #6b7280;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .no-results {
            text-align: center;
            color: #6b7280;
            font-size: 1.2rem;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
        }

        @media (max-width: 768px) {
            header {
                padding: 32px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .search-box {
                flex-direction: column;
                padding: 12px;
                gap: 8px;
            }

            .search-box button {
                width: 100%;
            }

            .restaurants-grid {
                grid-template-columns: 1fr;
            }

            .restaurant-name {
                font-size: 1.5rem;
            }

            .modal-content {
                margin: 10px;
            }

            .modal-header {
                padding: 28px 20px;
            }

            .modal-restaurant-name {
                font-size: 1.75rem;
                padding-right: 40px;
            }

            .menu-section {
                padding: 28px 20px;
            }

            .menu-title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Restaurant Search</h1>
            <p>Discover delicious restaurants and their menus</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search restaurants by name or cuisine...">
            <button onclick="searchRestaurants()">Search</button>
        </div>

        <div id="restaurantsContainer" class="restaurants-grid"></div>
        <div id="noResults" class="no-results" style="display: none;">No restaurants found</div>
    </div>

    <div id="menuModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="modal-restaurant-name" id="modalRestaurantName"></h2>
                <p class="modal-cuisine" id="modalCuisine"></p>
            </div>
            <div class="menu-section">
                <h3 class="menu-title">Menu</h3>
                <div id="menuItems"></div>
            </div>
        </div>
    </div>

    <script>
        const restaurants = [
            {
                id: 1,
                name: "Bella Italia",
                cuisine: "Italian",
                description: "Authentic Italian cuisine with fresh pasta and wood-fired pizzas",
                location: "Bandra West, Mumbai",
                image: "attached_assets/stock_images/italian_restaurant_i_6341ba14.jpg",
                menu: [
                    { name: "Margherita Pizza", price: "₹1,249", description: "Fresh mozzarella, tomato sauce, and basil" },
                    { name: "Spaghetti Carbonara", price: "₹1,399", description: "Creamy pasta with pancetta and parmesan" },
                    { name: "Lasagna Bolognese", price: "₹1,599", description: "Layers of pasta with rich meat sauce and béchamel" },
                    { name: "Risotto ai Funghi", price: "₹1,499", description: "Creamy mushroom risotto with porcini" },
                    { name: "Tiramisu", price: "₹749", description: "Classic Italian dessert with espresso and mascarpone" }
                ]
            },
            {
                id: 2,
                name: "Sushi Master",
                cuisine: "Japanese",
                description: "Premium sushi and sashimi crafted by expert chefs",
                location: "Colaba, Mumbai",
                image: "attached_assets/stock_images/japanese_sushi_resta_0be4c220.jpg",
                menu: [
                    { name: "Salmon Sashimi", price: "₹1,899", description: "Fresh Norwegian salmon, thinly sliced" },
                    { name: "Dragon Roll", price: "₹1,399", description: "Eel, avocado, cucumber topped with sliced avocado" },
                    { name: "Tuna Tataki", price: "₹1,649", description: "Seared tuna with ponzu sauce and scallions" },
                    { name: "Chirashi Bowl", price: "₹2,099", description: "Assorted sashimi over sushi rice" },
                    { name: "Miso Soup", price: "₹399", description: "Traditional Japanese soup with tofu and seaweed" }
                ]
            },
            {
                id: 3,
                name: "Taco Fiesta",
                cuisine: "Mexican",
                description: "Vibrant Mexican flavors with handmade tortillas and fresh ingredients",
                location: "Andheri West, Mumbai",
                image: "attached_assets/stock_images/mexican_restaurant_t_ff56fee0.jpg",
                menu: [
                    { name: "Street Tacos", price: "₹1,099", description: "Three tacos with carnitas, onions, and cilantro" },
                    { name: "Burrito Bowl", price: "₹1,149", description: "Rice, beans, meat, guacamole, and salsa" },
                    { name: "Quesadilla", price: "₹999", description: "Grilled tortilla with cheese and your choice of meat" },
                    { name: "Enchiladas Verdes", price: "₹1,249", description: "Chicken enchiladas with green tomatillo sauce" },
                    { name: "Churros", price: "₹579", description: "Fried dough pastries with cinnamon sugar and chocolate" }
                ]
            },
            {
                id: 4,
                name: "Le Petit Bistro",
                cuisine: "French",
                description: "Classic French dishes in a cozy, elegant atmosphere",
                location: "Worli, Mumbai",
                image: "attached_assets/stock_images/french_bistro_elegan_fd80a0d0.jpg",
                menu: [
                    { name: "French Onion Soup", price: "₹829", description: "Caramelized onions with gruyere cheese crust" },
                    { name: "Coq au Vin", price: "₹2,249", description: "Braised chicken in red wine with mushrooms" },
                    { name: "Beef Bourguignon", price: "₹2,399", description: "Tender beef stew with pearl onions and carrots" },
                    { name: "Ratatouille", price: "₹1,579", description: "Provençal vegetable medley" },
                    { name: "Crème Brûlée", price: "₹829", description: "Vanilla custard with caramelized sugar top" }
                ]
            },
            {
                id: 5,
                name: "Spice of India",
                cuisine: "Indian",
                description: "Aromatic curries and tandoori specialties from North and South India",
                location: "Powai, Mumbai",
                image: "attached_assets/stock_images/indian_restaurant_cu_e4177ee5.jpg",
                menu: [
                    { name: "Chicken Tikka Masala", price: "₹1,329", description: "Grilled chicken in creamy tomato sauce" },
                    { name: "Lamb Vindaloo", price: "₹1,499", description: "Spicy lamb curry with potatoes" },
                    { name: "Palak Paneer", price: "₹1,249", description: "Cottage cheese in creamy spinach gravy" },
                    { name: "Biryani", price: "₹1,399", description: "Fragrant basmati rice with spiced meat" },
                    { name: "Garlic Naan", price: "₹329", description: "Freshly baked flatbread with garlic and butter" }
                ]
            },
            {
                id: 6,
                name: "Dragon Wok",
                cuisine: "Chinese",
                description: "Traditional Chinese cuisine with Szechuan and Cantonese specialties",
                location: "Lower Parel, Mumbai",
                image: "attached_assets/stock_images/chinese_restaurant_w_a8679517.jpg",
                menu: [
                    { name: "Kung Pao Chicken", price: "₹1,249", description: "Spicy stir-fry with peanuts and vegetables" },
                    { name: "Sweet & Sour Pork", price: "₹1,329", description: "Crispy pork with tangy sauce and pineapple" },
                    { name: "Mapo Tofu", price: "₹1,149", description: "Spicy tofu in fermented bean sauce" },
                    { name: "Peking Duck", price: "₹2,749", description: "Crispy duck with pancakes and hoisin sauce" },
                    { name: "Fried Rice", price: "₹999", description: "Wok-fried rice with egg and vegetables" }
                ]
            }
        ];

        let currentRestaurants = [...restaurants];

        function displayRestaurants(restaurantsToShow) {
            const container = document.getElementById('restaurantsContainer');
            const noResults = document.getElementById('noResults');
            
            container.innerHTML = '';
            
            if (restaurantsToShow.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            restaurantsToShow.forEach(restaurant => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';
                card.onclick = () => showMenu(restaurant);
                
                card.innerHTML = `
                    <div class="restaurant-image">
                        <img src="${restaurant.image}" alt="${restaurant.name}">
                        <div class="restaurant-overlay">
                            <span class="restaurant-name-overlay">${restaurant.name}</span>
                        </div>
                    </div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">${restaurant.name}</div>
                        <div class="restaurant-cuisine">${restaurant.cuisine}</div>
                        <div class="restaurant-location">📍 ${restaurant.location}</div>
                        <div class="restaurant-description">${restaurant.description}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function searchRestaurants() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (searchTerm === '') {
                currentRestaurants = [...restaurants];
            } else {
                currentRestaurants = restaurants.filter(restaurant => 
                    restaurant.name.toLowerCase().includes(searchTerm) ||
                    restaurant.cuisine.toLowerCase().includes(searchTerm) ||
                    restaurant.description.toLowerCase().includes(searchTerm)
                );
            }
            
            displayRestaurants(currentRestaurants);
        }

        function showMenu(restaurant) {
            document.getElementById('modalRestaurantName').textContent = restaurant.name;
            document.getElementById('modalCuisine').textContent = restaurant.cuisine;
            
            const menuItemsContainer = document.getElementById('menuItems');
            menuItemsContainer.innerHTML = '';
            
            restaurant.menu.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <div class="menu-item-header">
                        <div class="menu-item-name">${item.name}</div>
                        <div class="menu-item-price">${item.price}</div>
                    </div>
                    <div class="menu-item-description">${item.description}</div>
                `;
                menuItemsContainer.appendChild(menuItem);
            });
            
            document.getElementById('menuModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('menuModal').classList.remove('active');
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchRestaurants();
            }
        });

        window.onclick = function(event) {
            const modal = document.getElementById('menuModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        displayRestaurants(currentRestaurants);
    </script>
</body>

                            chatWin.style.display = (chatWin.style.display === 'none' || chatWin.style.display === '') ? 'flex' : 'none';
                        };

                        // Simple JS bot logic using restaurants array
                                        var chatInput = document.getElementById('chat-input');
                                        chatInput.addEventListener('keydown', function(e) {
                                            if (e.key === 'Enter') {
                                                var input = chatInput.value.trim();
                                                if (!input) return;
                                                var messages = document.getElementById('chat-messages');
                                                var userMsg = document.createElement('div');
                                                userMsg.style.alignSelf = 'flex-end';
                                                userMsg.style.background = '#e5e7eb';
                                                userMsg.style.borderRadius = '12px';
                                                userMsg.style.margin = '4px 0';
                                                userMsg.style.padding = '8px 12px';
                                                userMsg.textContent = input;
                                                messages.appendChild(userMsg);
                                                messages.scrollTop = messages.scrollHeight;
                                                chatInput.value = '';

                                                // Bot response logic
                                                var reply = '';
                                                var lower = input.toLowerCase();
                                                // Price comparison: "compare price of <item>"
                                                var compareMatch = lower.match(/compare price[s]? of ([a-zA-Z ]+)/);
                                                if (compareMatch) {
                                                    var itemName = compareMatch[1].trim().toLowerCase();
                                                    var foundPrices = [];
                                                    for (var r of restaurants) {
                                                        for (var m of r.menu) {
                                                            if (m.name.toLowerCase().includes(itemName)) {
                                                                foundPrices.push(`<b>${m.name}</b> at <b>${r.name}</b>: ${m.price}`);
                                                            }
                                                        }
                                                    }
                                                    reply = foundPrices.length ? foundPrices.join('<br>') : 'Sorry, could not find that item in any restaurant.';
                                                }
                                                // Total cost calculation: "total cost of <item1> and <item2> at <restaurant>"
                                                else if (lower.match(/total cost of ([a-zA-Z ]+(?: and [a-zA-Z ]+)*) at ([a-zA-Z ]+)/)) {
                                                    var totalMatch = lower.match(/total cost of ([a-zA-Z ]+(?: and [a-zA-Z ]+)*) at ([a-zA-Z ]+)/);
                                                    var items = totalMatch[1].split(' and ').map(s => s.trim().toLowerCase());
                                                    var restName = totalMatch[2].trim().toLowerCase();
                                                    var foundRest = restaurants.find(r => r.name.toLowerCase() === restName);
                                                    if (foundRest) {
                                                        var total = 0;
                                                        var details = [];
                                                        for (var item of items) {
                                                            var menuItem = foundRest.menu.find(m => m.name.toLowerCase().includes(item));
                                                            if (menuItem) {
                                                                var priceNum = parseInt(menuItem.price.replace(/[^\d]/g, ''));
                                                                total += priceNum;
                                                                details.push(`${menuItem.name}: ${menuItem.price}`);
                                                            } else {
                                                                details.push(`${item}: Not found`);
                                                            }
                                                        }
                                                        reply = details.join('<br>') + `<br><b>Total: ₹${total}</b>`;
                                                    } else {
                                                        reply = 'Sorry, I could not find that restaurant.';
                                                    }
                                                }
                                                // Check for menu of a specific restaurant
                                                else {
                                                    var menuMatch = lower.match(/menu of ([a-zA-Z ]+)/);
                                                    if (menuMatch) {
                                                        var restName = menuMatch[1].trim().toLowerCase();
                                                        var foundRest = restaurants.find(r => r.name.toLowerCase() === restName);
                                                        if (foundRest) {
                                                            reply = `<b>${foundRest.name}</b> (${foundRest.cuisine})<br>Menu:<br>` + foundRest.menu.map(m => `${m.name} - ${m.price}`).join('<br>');
                                                        } else {
                                                            reply = 'Sorry, I could not find that restaurant.';
                                                        }
                                                    } else if (lower.includes('menu')) {
                                                        reply = 'Here are our restaurants and their cuisines:<br>' + restaurants.map(r => `<b>${r.name}</b> (${r.cuisine})`).join('<br>');
                                                    } else if (lower.includes('address') || lower.includes('location')) {
                                                        reply = 'Here are the restaurant addresses:<br>' + restaurants.map(r => `<b>${r.name}</b>: ${r.location}`).join('<br>');
                                                    } else if (lower.includes('price') || lower.includes('cost')) {
                                                        reply = 'Sample prices:<br>' + restaurants.map(r => `<b>${r.name}</b>: ${r.menu[0].name} - ${r.menu[0].price}`).join('<br>');
                                                    } else {
                                                        // Try to match restaurant name or menu item
                                                        var found = false;
                                                        for (var r of restaurants) {
                                                            if (lower.includes(r.name.toLowerCase())) {
                                                                reply = `<b>${r.name}</b> (${r.cuisine})<br>Location: ${r.location}<br>Menu:<br>` + r.menu.map(m => `${m.name} - ${m.price}`).join('<br>');
                                                                found = true;
                                                                break;
                                                            }
                                                            for (var m of r.menu) {
                                                                if (lower.includes(m.name.toLowerCase())) {
                                                                    reply = `${m.name} at <b>${r.name}</b> costs ${m.price}.<br>Description: ${m.description}`;
                                                                    found = true;
                                                                    break;
                                                                }
                                                            }
                                                            if (found) break;
                                                        }
                                                        if (!reply) reply = "Sorry, I can answer questions about menu, restaurant names, addresses, or pricing.";
                                                    }
                                                }
                                                var botMsg = document.createElement('div');
                                                botMsg.style.alignSelf = 'flex-start';
                                                botMsg.style.background = 'linear-gradient(135deg, #5B67D6 0%, #7B68B8 100%)';
                                                botMsg.style.color = 'white';
                                                botMsg.style.borderRadius = '12px';
                                                botMsg.style.margin = '4px 0';
                                                botMsg.style.padding = '8px 12px';
                                                botMsg.innerHTML = reply;
                                                messages.appendChild(botMsg);
                                                messages.scrollTop = messages.scrollHeight;
                                            }
                                        });
            </script>
</html>
