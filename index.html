<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .search-box {
            background: white;
            padding: 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            padding: 10px 20px;
            font-size: 1rem;
        }

        .search-box button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .restaurant-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .restaurant-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .restaurant-info {
            padding: 20px;
        }

        .restaurant-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .restaurant-cuisine {
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .restaurant-description {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal-restaurant-name {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .modal-cuisine {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .menu-section {
            padding: 30px;
        }

        .menu-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #333;
        }

        .menu-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f8f9fa;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .menu-item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .menu-item-price {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .menu-item-description {
            color: #666;
            line-height: 1.5;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .restaurants-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Restaurant Search</h1>
            <p>Discover delicious restaurants and their menus</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search restaurants by name or cuisine...">
            <button onclick="searchRestaurants()">Search</button>
        </div>

        <div id="restaurantsContainer" class="restaurants-grid"></div>
        <div id="noResults" class="no-results" style="display: none;">No restaurants found</div>
    </div>

    <div id="menuModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 class="modal-restaurant-name" id="modalRestaurantName"></h2>
                <p class="modal-cuisine" id="modalCuisine"></p>
            </div>
            <div class="menu-section">
                <h3 class="menu-title">Menu</h3>
                <div id="menuItems"></div>
            </div>
        </div>
    </div>

    <script>
        const restaurants = [
            {
                id: 1,
                name: "Bella Italia",
                cuisine: "Italian",
                description: "Authentic Italian cuisine with fresh pasta and wood-fired pizzas",
                icon: "🍕",
                menu: [
                    { name: "Margherita Pizza", price: "$14.99", description: "Fresh mozzarella, tomato sauce, and basil" },
                    { name: "Spaghetti Carbonara", price: "$16.99", description: "Creamy pasta with pancetta and parmesan" },
                    { name: "Lasagna Bolognese", price: "$18.99", description: "Layers of pasta with rich meat sauce and béchamel" },
                    { name: "Risotto ai Funghi", price: "$17.99", description: "Creamy mushroom risotto with porcini" },
                    { name: "Tiramisu", price: "$8.99", description: "Classic Italian dessert with espresso and mascarpone" }
                ]
            },
            {
                id: 2,
                name: "Sushi Master",
                cuisine: "Japanese",
                description: "Premium sushi and sashimi crafted by expert chefs",
                icon: "🍣",
                menu: [
                    { name: "Salmon Sashimi", price: "$22.99", description: "Fresh Norwegian salmon, thinly sliced" },
                    { name: "Dragon Roll", price: "$16.99", description: "Eel, avocado, cucumber topped with sliced avocado" },
                    { name: "Tuna Tataki", price: "$19.99", description: "Seared tuna with ponzu sauce and scallions" },
                    { name: "Chirashi Bowl", price: "$24.99", description: "Assorted sashimi over sushi rice" },
                    { name: "Miso Soup", price: "$4.99", description: "Traditional Japanese soup with tofu and seaweed" }
                ]
            },
            {
                id: 3,
                name: "Taco Fiesta",
                cuisine: "Mexican",
                description: "Vibrant Mexican flavors with handmade tortillas and fresh ingredients",
                icon: "🌮",
                menu: [
                    { name: "Street Tacos", price: "$12.99", description: "Three tacos with carnitas, onions, and cilantro" },
                    { name: "Burrito Bowl", price: "$13.99", description: "Rice, beans, meat, guacamole, and salsa" },
                    { name: "Quesadilla", price: "$11.99", description: "Grilled tortilla with cheese and your choice of meat" },
                    { name: "Enchiladas Verdes", price: "$14.99", description: "Chicken enchiladas with green tomatillo sauce" },
                    { name: "Churros", price: "$6.99", description: "Fried dough pastries with cinnamon sugar and chocolate" }
                ]
            },
            {
                id: 4,
                name: "Le Petit Bistro",
                cuisine: "French",
                description: "Classic French dishes in a cozy, elegant atmosphere",
                icon: "🥖",
                menu: [
                    { name: "French Onion Soup", price: "$9.99", description: "Caramelized onions with gruyere cheese crust" },
                    { name: "Coq au Vin", price: "$26.99", description: "Braised chicken in red wine with mushrooms" },
                    { name: "Beef Bourguignon", price: "$28.99", description: "Tender beef stew with pearl onions and carrots" },
                    { name: "Ratatouille", price: "$18.99", description: "Provençal vegetable medley" },
                    { name: "Crème Brûlée", price: "$9.99", description: "Vanilla custard with caramelized sugar top" }
                ]
            },
            {
                id: 5,
                name: "Spice of India",
                cuisine: "Indian",
                description: "Aromatic curries and tandoori specialties from North and South India",
                icon: "🍛",
                menu: [
                    { name: "Chicken Tikka Masala", price: "$15.99", description: "Grilled chicken in creamy tomato sauce" },
                    { name: "Lamb Vindaloo", price: "$17.99", description: "Spicy lamb curry with potatoes" },
                    { name: "Palak Paneer", price: "$14.99", description: "Cottage cheese in creamy spinach gravy" },
                    { name: "Biryani", price: "$16.99", description: "Fragrant basmati rice with spiced meat" },
                    { name: "Garlic Naan", price: "$3.99", description: "Freshly baked flatbread with garlic and butter" }
                ]
            },
            {
                id: 6,
                name: "Dragon Wok",
                cuisine: "Chinese",
                description: "Traditional Chinese cuisine with Szechuan and Cantonese specialties",
                icon: "🥡",
                menu: [
                    { name: "Kung Pao Chicken", price: "$14.99", description: "Spicy stir-fry with peanuts and vegetables" },
                    { name: "Sweet & Sour Pork", price: "$15.99", description: "Crispy pork with tangy sauce and pineapple" },
                    { name: "Mapo Tofu", price: "$13.99", description: "Spicy tofu in fermented bean sauce" },
                    { name: "Peking Duck", price: "$32.99", description: "Crispy duck with pancakes and hoisin sauce" },
                    { name: "Fried Rice", price: "$11.99", description: "Wok-fried rice with egg and vegetables" }
                ]
            }
        ];

        let currentRestaurants = [...restaurants];

        function displayRestaurants(restaurantsToShow) {
            const container = document.getElementById('restaurantsContainer');
            const noResults = document.getElementById('noResults');
            
            container.innerHTML = '';
            
            if (restaurantsToShow.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            restaurantsToShow.forEach(restaurant => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';
                card.onclick = () => showMenu(restaurant);
                
                card.innerHTML = `
                    <div class="restaurant-image">${restaurant.icon}</div>
                    <div class="restaurant-info">
                        <div class="restaurant-name">${restaurant.name}</div>
                        <div class="restaurant-cuisine">${restaurant.cuisine}</div>
                        <div class="restaurant-description">${restaurant.description}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function searchRestaurants() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (searchTerm === '') {
                currentRestaurants = [...restaurants];
            } else {
                currentRestaurants = restaurants.filter(restaurant => 
                    restaurant.name.toLowerCase().includes(searchTerm) ||
                    restaurant.cuisine.toLowerCase().includes(searchTerm) ||
                    restaurant.description.toLowerCase().includes(searchTerm)
                );
            }
            
            displayRestaurants(currentRestaurants);
        }

        function showMenu(restaurant) {
            document.getElementById('modalRestaurantName').textContent = restaurant.name;
            document.getElementById('modalCuisine').textContent = restaurant.cuisine;
            
            const menuItemsContainer = document.getElementById('menuItems');
            menuItemsContainer.innerHTML = '';
            
            restaurant.menu.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <div class="menu-item-header">
                        <div class="menu-item-name">${item.name}</div>
                        <div class="menu-item-price">${item.price}</div>
                    </div>
                    <div class="menu-item-description">${item.description}</div>
                `;
                menuItemsContainer.appendChild(menuItem);
            });
            
            document.getElementById('menuModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('menuModal').classList.remove('active');
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchRestaurants();
            }
        });

        window.onclick = function(event) {
            const modal = document.getElementById('menuModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        displayRestaurants(currentRestaurants);
    </script>
</body>
</html>
